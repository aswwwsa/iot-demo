<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物联网数据可视化</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background: #f0f4f8;
      color: #333;
      padding: 24px;
    }
    h1 { font-size: 22px; margin-bottom: 16px; }
    .cards { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 16px 24px;
      min-width: 150px;
    }
    .card .label { font-size: 13px; color: #888; margin-bottom: 6px; }
    .card .value { font-size: 28px; font-weight: bold; }
    .card .value.temp { color: #e05252; }
    .card .value.humi { color: #3a7bd5; }
    .card .value.small { font-size: 16px; }
    .panel {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 16px 24px;
      margin-bottom: 20px;
    }
    .panel h2 { font-size: 16px; margin-bottom: 10px; }
    canvas { width: 100%; height: 220px; display: block; }
    #waiting {
      text-align: center;
      color: #999;
      padding: 40px 0;
      font-size: 15px;
      display: none;
    }
    .status { font-size: 13px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>物联网数据可视化（publisher.js 实时发布）</h1>

  <div class="cards">
    <div class="card">
      <div class="label">设备编号</div>
      <div class="value small" id="deviceId">--</div>
    </div>
    <div class="card">
      <div class="label">最新温度</div>
      <div class="value temp"><span id="temperature">--</span> ℃</div>
    </div>
    <div class="card">
      <div class="label">最新湿度</div>
      <div class="value humi"><span id="humidity">--</span> %</div>
    </div>
    <div class="card">
      <div class="label">更新时间</div>
      <div class="value small" id="time">--</div>
    </div>
  </div>

  <div id="waiting">等待数据……（请确认 publisher.js 正在运行）</div>

  <div class="panel">
    <h2>温度变化（℃）</h2>
    <canvas id="tempChart" width="900" height="220"></canvas>
  </div>

  <div class="panel">
    <h2>湿度变化（%）</h2>
    <canvas id="humiChart" width="900" height="220"></canvas>
    <div class="status" id="status">每 2 秒自动刷新</div>
  </div>

  <script>
    // 从 Express 接口拉取 publisher 实际发布的数据
    async function fetchData() {
      try {
        const res = await fetch('/api/data');
        const data = await res.json();
        render(data);
      } catch (e) {
        document.getElementById('status').textContent = '数据获取失败：' + e.message;
      }
    }

    function render(data) {
      const waiting = document.getElementById('waiting');
      if (!data || data.length === 0) {
        waiting.style.display = 'block';
        return;
      }
      waiting.style.display = 'none';

      // 最新数值
      const latest = data[data.length - 1];
      document.getElementById('deviceId').textContent = latest.deviceId;
      document.getElementById('temperature').textContent = latest.temperature;
      document.getElementById('humidity').textContent = latest.humidity;
      document.getElementById('time').textContent =
        new Date(latest.ts).toLocaleTimeString('zh-CN');

      // 折线图
      drawChart('tempChart', data.map(d => Number(d.temperature)), '#e05252');
      drawChart('humiChart', data.map(d => Number(d.humidity)), '#3a7bd5');

      document.getElementById('status').textContent =
        '已接收 ' + data.length + ' 条数据，每 2 秒自动刷新';
    }

    // 原生 Canvas 折线图（不依赖任何前端框架）
    function drawChart(canvasId, values, color) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const pad = 36;
      ctx.clearRect(0, 0, W, H);

      if (values.length === 0) return;

      let min = Math.min(...values);
      let max = Math.max(...values);
      if (min === max) { min -= 1; max += 1; }
      const range = max - min;
      min -= range * 0.1;
      max += range * 0.1;

      const x = i => pad + (W - pad * 2) * (values.length === 1 ? 0.5 : i / (values.length - 1));
      const y = v => H - pad - (H - pad * 2) * (v - min) / (max - min);

      // 网格与纵轴刻度
      ctx.strokeStyle = '#eee';
      ctx.fillStyle = '#999';
      ctx.font = '12px sans-serif';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const v = min + (max - min) * i / 4;
        const yy = y(v);
        ctx.beginPath();
        ctx.moveTo(pad, yy);
        ctx.lineTo(W - pad, yy);
        ctx.stroke();
        ctx.fillText(v.toFixed(1), 4, yy + 4);
      }

      if (values.length < 2) return;

      // 折线
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      values.forEach((v, i) => {
        if (i === 0) ctx.moveTo(x(i), y(v));
        else ctx.lineTo(x(i), y(v));
      });
      ctx.stroke();

      // 数据点
      ctx.fillStyle = color;
      values.forEach((v, i) => {
        ctx.beginPath();
        ctx.arc(x(i), y(v), 3, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    fetchData();
    setInterval(fetchData, 2000);
  </script>
</body>
</html>
